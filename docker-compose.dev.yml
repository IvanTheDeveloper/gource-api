services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - FLASK_DEBUG=-1
      - FLASK_ENV=development
      - CONTAINER_PORT=${CONTAINER_PORT:-8080}
    ports:
      - ${HOST_PORT:-8080}:${CONTAINER_PORT:-8080}
    volumes:
      - .:/app
    command:
